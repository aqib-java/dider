<% layout("/layouts/studio") %>
<% it.title = "Register — Dider Studio" %>

<div>
  <h1 class="text-2xl font-bold mb-1 text-center text-navy-900">Buat Akun Dider</h1>
  <p class="text-center text-sm text-slate-500 mb-6">Daftar untuk mulai mengunggah publikasi</p>
  <%~ include("/partials/errors", { errors: it.errors }) %>
  <form method="post" action="/studio/register" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
    <div>
      <label for="full_name" class="block text-sm font-medium mb-1">Nama Lengkap (opsional)</label>
      <input id="full_name" name="full_name" value="<%= it.old.full_name ?? '' %>"
        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold-500 focus:border-gold-500" />
    </div>
    <div>
      <label for="username" class="block text-sm font-medium mb-1">Username</label>
      <input id="username" name="username" required value="<%= it.old.username ?? '' %>"
        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold-500 focus:border-gold-500" />
    </div>
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Password</label>
      <input id="password" name="password" type="password" required
        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold-500 focus:border-gold-500" />
    </div>
    <button type="submit" class="w-full bg-navy-900 text-white font-semibold py-2.5 rounded-lg hover:bg-navy-800">Daftar</button>
  </form>
  <p class="text-center text-sm text-slate-500 mt-4">
    Sudah punya akun? <a href="/studio/login" class="text-navy-700 hover:underline">Login</a>
  </p>
</div>
