name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # 'edited' ikut dipicu supaya mengganti base branch sebuah PR
    # (mis. dari branch bertumpuk ke master) langsung menjalankan CI.
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    name: Test & Build CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build CSS
        run: bun run build:css
